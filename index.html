<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lista de Tarefas com DOM e localStorage - Atividade Guiada de Desenvolvimento Web 2">
  <title>Lista de Tarefas · DOM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="cartao">
    <h1>Lista de Tarefas</h1>

    <form id="formTarefa">
      <input type="text" id="campoTarefa"
             placeholder="O que você precisa fazer?"
             autocomplete="off">
      <button type="submit">Adicionar</button>
    </form>

    <p id="erro" class="erro"></p>

    <ul id="lista"></ul>

    <div class="rodape">
      <span id="contador">0 tarefas pendentes</span>
      <button type="button" id="btnLimpar">Limpar concluídas</button>
    </div>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
